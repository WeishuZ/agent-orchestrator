<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Orchestrator</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><div class="terminal-title"><span class="prompt-mark">&gt;_</span><div><h1>agent-orchestrator <span>/ runs</span></h1><p>local workspace · live execution</p></div></div><div class="header-actions"><button id="examples-btn" class="secondary">[+] examples</button><button id="new-btn" class="primary">[+] new run</button></div></header>
<section id="question-inbox" aria-label="Pending questions" hidden></section><div class="workspace"><section class="list-panel"><div class="section-head"><div><h2>RUNS</h2><p>select a process</p></div><span id="run-count" class="count">0</span></div><label class="run-filter-label">Filter<select id="run-filter" aria-label="Filter runs"><option value="all">All runs</option><option value="active">Active</option><option value="waiting">Needs input</option><option value="failed">Failed / stopped</option></select></label><div id="runs" class="runs"></div><div class="worker"><span class="online"></span><span id="worker-status">workers: ready</span></div></section>
<section class="detail" id="detail"><div class="empty"><div class="empty-icon">◇</div><h2>no run selected</h2><p>select a process or start a new run_</p></div></section></div></main>
<dialog id="dialog"><form id="launch-form"><div class="modal-head"><div><h2>&gt; new_run</h2><p>configure workflow parameters</p></div><button type="button" id="close" class="icon-button" aria-label="Close">×</button></div><label>Workflow<select id="workflow"><option value="label">Label and aggregate</option><option value="qc">Generate and QC</option><option value="distribution">Distribution shaping</option></select></label><label id="input-label">Documents <span>One per line</span><textarea id="input" rows="6" required></textarea></label><label id="reviewers-wrap" hidden>QC checks<select id="reviewers"><option value="general">General QC</option><option value="multiple">Accuracy + clarity (parallel)</option></select></label><label id="target-wrap" hidden>Target distribution<select id="target"><option value="uniform">Uniform</option><option value="normal">Normal</option></select></label><div class="form-row"><label>Run limit <span>USD · optional</span><input id="run-budget" type="number" min="0.000001" step="0.000001" placeholder="No limit"></label><label>Call limit <span>USD · optional</span><input id="call-budget" type="number" min="0.000001" step="0.000001" placeholder="No limit"></label></div><p class="hint">limits checked after each call; in-flight calls finish.</p><div id="form-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" id="cancel" class="secondary">Cancel</button><button class="primary">run workflow →</button></div></form></dialog><dialog id="node-dialog" aria-labelledby="node-title"><div id="node-content"></div></dialog><section id="graph-fullscreen" class="canvas-fullscreen" aria-label="Full-screen workflow canvas" hidden><div class="canvas-toolbar"><div><strong>Execution graph</strong><span id="canvas-run-name"></span></div><button id="canvas-exit" class="secondary">Exit full screen ⤢</button></div><div id="canvas-content"></div></section><script src="/app.js"></script></body></html>
